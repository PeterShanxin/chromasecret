name: Fix locale-independent option values
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-i18n-values.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrowly scoped source and regression-test fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='<option key={x}>{x}</option>'
          new='<option key={x} value={x}>{x}</option>'
          assert s.count(old)==1, 'Expected source changed; review rather than overwriting'
          p.write_text(s.replace(old,new))
          p=Path('scripts/i18n_smoke.py')
          s=p.read_text()
          old="        authored = '私密QA7926\\nhey meow'"
          assert s.count(old)==1
          s=s.replace(old,"        strength = page.locator('.studio-controls select').nth(1)\n        expect(strength).to_have_value('Balanced')\n        check(strength.locator('option').evaluate_all('(nodes)=>nodes.map(n=>n.value)') == ['Low','Balanced','Strong','Extreme'], f'{browser_locale}: option values independent of locale')\n        strength.select_option('Strong')\n"+old)
          old="        check(True, f'{browser_locale}: authored Unicode preserved across switches')"
          assert s.count(old)==1
          s=s.replace(old,"        expect(strength).to_have_value('Strong')\n        check(True, f'{browser_locale}: selected strength preserved across language switches')\n"+old)
          p.write_text(s)
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Verify the rebuilt artifact and commit
        run: |
          echo 'f0bd0480ec9055a7812d4ebeb7dbcf5348ec33a038dc46df1e1a711b24503451  index.html' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx scripts/i18n_smoke.py index.html
          git commit -m 'fix(i18n): keep canonical select values across locale switches'
          git push origin HEAD:main
